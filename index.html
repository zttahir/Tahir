<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* HEADER */
.header{
    background:#ff5c00;
    padding:15px;
    text-align:center;
    color:white;
    font-size:22px;
    font-weight:bold;
}

/* SEARCH BAR */
.search-box{
    display:flex;
    margin:15px;
}
.search-box input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px 0 0 5px;
}
.search-box button{
    background:#ff5c00;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:0 5px 5px 0;
}

/* CARD */
.card{
    background:white;
    margin:15px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
}

.card-content{
    padding:15px;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.date{
    font-size:12px;
    color:gray;
}
</style>

</head>
<body>

<div class="header">
MY EDITZ BLOG
</div>

<div class="search-box">
<input type="text" placeholder="Search...">
<button>Search</button>
</div>

<div class="card">
<img src="https://picsum.photos/600/300" />
<div class="card-content">
<div class="title">Instagram Lofi Dusk Filter AI Editing</div>
<div class="date">May 2026 • Admin</div>
<p>Yahan tum apna article likh sakte ho...</p>
</div>
</div>

</body>
</html>
